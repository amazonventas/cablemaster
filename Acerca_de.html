<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CableMaster</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="styles.css" />

    <link rel="icon" href="imagenes/icono.png" type="image/png" />
  </head>

  <body>
    <div class="container-fluid pantalla-completa d-flex flex-column">
      <!-- HEADER -->
      <header class="navbar-custom">
        <div class="logo-container">
          <img src="imagenes/icono.png" class="logo" alt="logo" />

          <div>
            <h1 class="titulo-app">Acerca de</h1>
            <span class="subtitulo-app">Herramientas Eléctricas</span>
          </div>
        </div>

        <button class="btn-menu" onclick="toggleMenu()">
          <i class="bi bi-list"></i>
        </button>
      </header>

      <!-- MENU LATERAL -->
      <div id="menuLateral" class="menu-lateral">
        <div class="menu-header">
          <h4>CableMaster</h4>
        </div>

        <ul>
          <li>
            <a href="index.html" style="text-decoration: none; color: white">
              <i class="bi bi-house-door-fill"></i>
              Inicio</a
            >
          </li>

          <li onclick="window.location.href='Acerca_de.html'">
            <i class="bi bi-info-circle-fill"></i>
            Acerca de
          </li>

          <li onclick="cerrarMenu()">
            <i class="bi bi-x-circle-fill"></i>
            Cerrar
          </li>
        </ul>
      </div>

      <!-- Contenedor Principal -->
      <div class="Contenedor">
        <div id="contenedor-tablas" class="mb-4">
          <br />
          <div style="display: flex">
            <div style="margin-left: 20px">
              <h3 style="color: blue">CABLEMASTER</h3>
              <label style="color: blue"><strong> version 2.0</strong></label>
            </div>
          </div>
          <hr />
          <center>
            <h5 data-i18n="Pagina-desarrollador">Página del desarrollador</h5>
            <a
              href="https://play.google.com/store/apps/dev?id=8605774119180036028&hl=es_419"
              target="_blank">
              <img
                style="width: 80%; height: 40%"
                src="imagenes/Pagina Desarrollador.jpg"
                alt=""
            /></a>
            <br /><br />
            <div style="display: flex; justify-content: center">
              <img
                style="width: 10%; height: 10%"
                src="imagenes/correo.jpg"
                alt="" />
              <h6 style="margin-left: 5px">electricidadfacil80@gmail.com</h6>
            </div>
            <br />
            <br /><br />
            <hr />

            <p
              style="font-size: 15px; font-weight: 700"
              data-i18n="derechos_reservados">
              2026 - Todos los derechos reservados
            </p>
          </center>
        </div>
      </div>
      <!-- Fin Contenedor Principal -->
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('lang') || 'es';
      });

      function Page_Acerca_de() {
        window.location.href = 'Acerca_de.html';
      }

      function Mostrar_menu() {
        const menu = document.getElementById('menuLateral');
        if (menu.style.right === '0px') {
          menu.style.right = '-200px'; // ocultar
        } else {
          menu.style.right = '0px'; // mostrar
        }
      }

      function toggleMenu() {
        const menu = document.getElementById('menuLateral');

        if (menu.style.right === '0px') {
          menu.style.right = '-260px';
        } else {
          menu.style.right = '0px';
        }
      }

      function cerrarMenu() {
        document.getElementById('menuLateral').style.right = '-260px';
      }
    </script>
  </body>
</html>
