<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Canalizaciones Eléctricas - CableMaster</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="navbar-custom">
      <div class="logo-container">
        <img src="imagenes/icono.png" class="logo" alt="" />

        <h1 class="titulo-app">Aislamientos</h1>

        <span class="subtitulo-app"> Conductores Eléctricos </span>
      </div>

      <a href="index.html" class="btn-volver">
        <i class="bi bi-arrow-left"></i>
      </a>
    </header>

    <!-- CONTENIDO -->
    <main class="container py-4">
      <div class="breaker-card">
        <!-- TITULO -->
        <div class="titulo-seccion">
          <i class="bi bi-plug-fill"></i>

          Aislamiento Conductores Eléctricos
        </div>

        <!-- NORMA -->
        <div class="mb-4">
          <label class="form-label text-light"> Seleccione tipo: </label>

          <select
            id="normaAislamiento"
            class="form-select custom-select"
            onchange="mostrarAislamientos()">
            <option value="">Seleccione norma</option>

            <option value="NEMA">NEMA / NEC</option>

            <option value="IEC">IEC</option>
          </select>
        </div>

        <!-- RESULTADOS -->
        <div id="resultado"></div>
      </div>
    </main>

    <script>
      function mostrarAislamientos() {
        const tipo = document.getElementById('normaAislamiento').value;

        const resultado = document.getElementById('resultado');

        if (tipo === '') {
          resultado.innerHTML = '';

          return;
        }

        resultado.innerHTML = `

    <div class="resultado-card">

      <h3 class="resultado-title">

        <i class="bi bi-shield-fill-check"></i>

        Aislamientos ${tipo}

      </h3>

      <p class="resultado-text">

        Tipos de aislamiento utilizados
        en conductores eléctricos.

      </p>

      ${generarTablaAislamiento(tipo)}

    </div>

  `;
      }

      /* ========================= */
      /* TABLAS */
      /* ========================= */

      function generarTablaAislamiento(tipo) {
        let filas = '';

        /* NEMA / NEC */

        if (tipo === 'NEMA') {
          filas = `

      <tr>
        <td>TW</td>
        <td>60°C</td>
        <td>Termoplástico resistente a humedad</td>
      </tr>

      <tr>
        <td>THW</td>
        <td>75°C</td>
        <td>Termoplástico resistente al calor y humedad</td>
      </tr>

      <tr>
        <td>THHN</td>
        <td>90°C</td>
        <td>Nylon resistente al calor</td>
      </tr>

      <tr>
        <td>THWN</td>
        <td>75°C</td>
        <td>Resistente al agua y calor</td>
      </tr>

      <tr>
        <td>XHHW</td>
        <td>90°C</td>
        <td>Polietileno reticulado</td>
      </tr>

      <tr>
        <td>RHW-2</td>
        <td>90°C</td>
        <td>Caucho resistente al agua</td>
      </tr>

      <tr>
        <td>USE-2</td>
        <td>90°C</td>
        <td>Uso subterráneo</td>
      </tr>

    `;
        }

        /* IEC */

        if (tipo === 'IEC') {
          filas = `

      <tr>
        <td>PVC</td>
        <td>70°C</td>
        <td>Policloruro de vinilo</td>
      </tr>

      <tr>
        <td>XLPE</td>
        <td>90°C</td>
        <td>Polietileno reticulado</td>
      </tr>

      <tr>
        <td>EPR</td>
        <td>90°C</td>
        <td>Caucho etileno propileno</td>
      </tr>

      <tr>
        <td>LSZH</td>
        <td>90°C</td>
        <td>Bajo humo libre de halógenos</td>
      </tr>

      <tr>
        <td>PE</td>
        <td>75°C</td>
        <td>Polietileno</td>
      </tr>

      <tr>
        <td>MICC</td>
        <td>250°C</td>
        <td>Aislado mineral</td>
      </tr>

    `;
        }

        return `

    <div class="material-header">

      <i class="bi bi-shield-fill-check"></i>

      <span>${tipo}</span>

    </div>

    <div class="tabla-responsive">

      <table class="table table-dark table-bordered table-sm align-middle">

        <thead>

          <tr>
            <th>Tipo</th>
            <th>Temp.</th>
            <th>Descripción</th>
          </tr>

        </thead>

        <tbody>

          ${filas}

        </tbody>

      </table>

    </div>

    <div class="leyenda-box">

      <div class="leyenda-title">

        <i class="bi bi-info-circle-fill"></i>

        Información

      </div>

      <div class="leyenda-grid">

        <div>
          <span class="badge bg-success">60° - 75°C</span>
          <small>Uso residencial y comercial</small>
        </div>

        <div>
          <span class="badge bg-danger">90°C</span>
          <small>Industrial y alta temperatura</small>
        </div>

        <div>
          <span class="badge bg-warning text-dark">LSZH</span>
          <small>Bajo humo y libre de halógenos</small>
        </div>

      </div>

      <hr style="border-color:#334155">

      <small style="color:#94a3b8">

        Tipos de aislamiento utilizados
        en instalaciones eléctricas
        de baja tensión.

      </small>

    </div>

  `;
      }
    </script>
  </body>
</html>
