<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cables - CableMaster</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="navbar-custom">
      <div class="logo-container">
        <img src="imagenes/icono.png" class="logo" alt="" />

        <div>
          <h1 class="titulo-app">Cables</h1>

          <span class="subtitulo-app"> Conductores Eléctricos </span>
        </div>
      </div>

      <a href="index.html" class="btn-volver">
        <i class="bi bi-arrow-left"></i>
      </a>
    </header>

    <!-- CONTENIDO -->
    <main class="container py-4">
      <div class="breaker-card">
        <!-- TITULO -->
        <div class="titulo-seccion">
          <i class="bi bi-plug-fill"></i>

          Capacidad de Conductores
        </div>

        <!-- NORMA -->
        <div class="mb-4">
          <label class="form-label text-light"> Seleccione la norma </label>

          <select
            id="norma"
            class="form-select custom-select"
            onchange="mostrarConductores()">
            <option value="">Seleccione</option>

            <option value="NEMA">NEMA / NEC</option>

            <option value="IEC">IEC</option>
          </select>
        </div>

        <!-- RESULTADOS -->
        <div id="resultado"></div>
      </div>
    </main>

    <script>
      function mostrarConductores() {
        const norma = document.getElementById('norma').value;

        const resultado = document.getElementById('resultado');

        if (norma === '') {
          resultado.innerHTML = '';

          return;
        }

        /* ========================= */
        /* NEMA / NEC */
        /* ========================= */

        if (norma === 'NEMA') {
          resultado.innerHTML = `

      <div class="resultado-card">

        <h3 class="resultado-title">
          <i class="bi bi-lightning-charge-fill"></i>
          Conductores NEMA / NEC
        </h3>

        <p class="resultado-text">

          Capacidades de corriente para conductores
          según NEC.

        </p>

        ${generarTablaNEMA()}

      </div>

    `;
        }

        /* ========================= */
        /* IEC */
        /* ========================= */

        if (norma === 'IEC') {
          resultado.innerHTML = `

      <div class="resultado-card">

        <h3 class="resultado-title">
          <i class="bi bi-globe"></i>
          Conductores IEC
        </h3>

        <p class="resultado-text">

          Capacidades de corriente para conductores
          según IEC.

        </p>

        ${generarTablaIEC()}

      </div>

    `;
        }
      }

      /* ========================= */
      /* TABLA NEMA */
      /* ========================= */

      function generarTablaNEMA() {
        return `

    <!-- COBRE -->
    <div class="material-header">

    </div>

      <table class="table table-dark table-bordered table-sm align-middle text-center">

        <thead>

          <tr>
            <th>AWG</th>
            <th>60°</th>
            <th>75°</th>
            <th>90°</th>
          </tr>

        </thead>

        <tbody>

          <tr><td>14</td><td>15</td><td>20</td><td>25</td></tr>
          <tr><td>12</td><td>20</td><td>25</td><td>30</td></tr>
          <tr><td>10</td><td>30</td><td>35</td><td>40</td></tr>

          <tr><td>3</td><td>85</td><td>100</td><td>115</td></tr>

          <tr><td>1</td><td>110</td><td>130</td><td>145</td></tr>

          <tr><td>2/0</td><td>145</td><td>175</td><td>195</td></tr>
          <tr><td>3/0</td><td>165</td><td>200</td><td>225</td></tr>
          <tr><td>4/0</td><td>195</td><td>230</td><td>260</td></tr>
          <tr><td>250</td><td>215</td><td>255</td><td>290</td></tr>

    <!-- ALUMINIO -->

    <div class="tabla-responsive">

            <th>AWG</th>

          </tr>

        </thead>

        <tbody>

          <tr><td>12</td><td>15</td><td>20</td><td>25</td></tr>
          <tr><td>10</td><td>25</td><td>30</td><td>35</td></tr>
          <tr><td>8</td><td>35</td><td>40</td><td>45</td></tr>
          <tr><td>6</td><td>40</td><td>50</td><td>55</td></tr>
          <tr><td>4</td><td>55</td><td>65</td><td>75</td></tr>
          <tr><td>3</td><td>65</td><td>75</td><td>85</td></tr>
          <tr><td>2</td><td>75</td><td>90</td><td>100</td></tr>
          <tr><td>1</td><td>85</td><td>100</td><td>115</td></tr>
          <tr><td>1/0</td><td>100</td><td>120</td><td>135</td></tr>
          <tr><td>2/0</td><td>115</td><td>135</td><td>150</td></tr>
          <tr><td>3/0</td><td>130</td><td>155</td><td>175</td></tr>
          <tr><td>4/0</td><td>150</td><td>180</td><td>205</td></tr>
          <tr><td>250</td><td>170</td><td>205</td><td>230</td></tr>
          <tr><td>300</td><td>190</td><td>230</td><td>255</td></tr>
          <tr><td>350</td><td>210</td><td>250</td><td>280</td></tr>
          <tr><td>400</td><td>225</td><td>270</td><td>305</td></tr>
          <tr><td>500</td><td>260</td><td>310</td><td>350</td></tr>

        </tbody>

      </table>

    </div>

    <!-- LEYENDA -->

    <div class="leyenda-box">

      <div class="leyenda-title">

        <i class="bi bi-info-circle-fill"></i>

        Leyenda de aislamiento

      </div>

      <div class="leyenda-grid">

        <div>
          <span class="badge bg-success">60°C</span>
          <small>TW, UF</small>
        </div>

        <div>
          <span class="badge bg-warning text-dark">75°C</span>
          <small>THW, THWN</small>
        </div>

        <div>
          <span class="badge bg-danger">90°C</span>
          <small>THHN, XHHW, RHW-2</small>
        </div>

      </div>

    </div>

  `;
      }
      /* ========================= */
      /* TABLA IEC */
      /* ========================= */

        return `

    <!-- COBRE -->

    <div class="material-header">

      <i class="bi bi-lightning-charge-fill"></i>

    <div class="tabla-responsive">

      <table class="table table-dark table-bordered table-sm align-middle text-center">

        <thead>

          <tr>
            <th>mm²</th>

          <tr><td>240</td><td>346</td><td>396</td></tr>

        </tbody>

      </table>

    </div>

    <!-- ALUMINIO -->

    <div class="material-header mt-4">

      <i class="bi bi-lightning-charge"></i>

      <span>Aluminio</span>

    </div>

    <div class="tabla-responsive">

      <table class="table table-dark table-bordered table-sm align-middle text-center">

        <thead>

          <tr>
            <th>mm²</th>
            <th>70°</th>
            <th>90°</th>
          </tr>

        </thead>

        <tbody>

          <tr><td>16</td><td>50</td><td>58</td></tr>
          <tr><td>25</td><td>68</td><td>76</td></tr>
          <tr><td>35</td><td>85</td><td>96</td></tr>
          <tr><td>50</td><td>104</td><td>117</td></tr>
          <tr><td>70</td><td>133</td><td>149</td></tr>
          <tr><td>95</td><td>161</td><td>180</td></tr>
          <tr><td>120</td><td>186</td><td>208</td></tr>
          <tr><td>150</td><td>211</td><td>236</td></tr>
          <tr><td>185</td><td>240</td><td>268</td></tr>
          <tr><td>240</td><td>282</td><td>315</td></tr>

        </tbody>

      </table>

    </div>

    <!-- LEYENDA -->

    <div class="leyenda-box">

      <div class="leyenda-title">

        <i class="bi bi-info-circle-fill"></i>

        Leyenda IEC

      </div>

      <div class="leyenda-grid">

        <div>
          <span class="badge bg-warning text-dark">70°C</span>
          <small>PVC</small>
        </div>

        <div>
          <span class="badge bg-danger">90°C</span>
          <small>XLPE, EPR</small>
        </div>

      </div>

      <hr style="border-color:#334155">

      <small style="color:#94a3b8">

        Capacidades típicas IEC para conductores
        en canalización y baja tensión.

      </small>

    </div>

  `;
      }
    </script>
  </body>
</html>
